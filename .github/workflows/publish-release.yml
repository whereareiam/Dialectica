name: Publish release
on:
  release:
    types: [published]
permissions:
  contents: write
  id-token: write
concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]] || { echo "Expected a semantic release tag" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and verify all database families
        run: ./gradlew --no-daemon clean test build -PintegrationTests=true
      - name: Publish packages
        uses: whereareiam/devops/actions/registry/maven-publish@v2
        with:
          visibility: public
          repository: packages
          command: ./gradlew --no-daemon publish
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/release-assets.py
