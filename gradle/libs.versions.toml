[versions]

# general
lombok = "1.18.42"
jetbrains-annotations = "26.0.2"

# database
jdbi = "3.55.0"
postgresql = "42.7.8"
mariadb = "3.5.6"
mysql = "26.7.0"
sqlite = "3.53.4.0"

# testing
junit = "6.0.1"
h2 = "2.5.252"
testcontainers = "1.21.4"

[libraries]

# general
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }

# database
jdbi-core = { group = "org.jdbi", name = "jdbi3-core", version.ref = "jdbi" }
jdbi-sqlobject = { group = "org.jdbi", name = "jdbi3-sqlobject", version.ref = "jdbi" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
mariadb = { group = "org.mariadb.jdbc", name = "mariadb-java-client", version.ref = "mariadb" }
mysql = { group = "com.mysql", name = "mysql-connector-j", version.ref = "mysql" }
sqlite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }

# testing
h2 = { module = "com.h2database:h2", version.ref = "h2" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher" }
testcontainers-junit = { group = "org.testcontainers", name = "junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgres = { group = "org.testcontainers", name = "postgresql", version.ref = "testcontainers" }
testcontainers-mariadb = { group = "org.testcontainers", name = "mariadb", version.ref = "testcontainers" }
testcontainers-mysql = { group = "org.testcontainers", name = "mysql", version.ref = "testcontainers" }

[bundles]
testing = ["junit-jupiter", "testcontainers-junit", "testcontainers-postgres", "testcontainers-mariadb", "testcontainers-mysql"]